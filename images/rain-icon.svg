<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .drop { animation: fall 1.4s ease-in infinite; }
    .d2 { animation-delay: .35s; } .d3 { animation-delay: .7s; } .d4 { animation-delay: .2s; } .d5 { animation-delay: .9s; }
    @keyframes fall { 0% { transform: translate(6px,-8px); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(-6px,10px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .drop { animation: none; } }
  </style>
