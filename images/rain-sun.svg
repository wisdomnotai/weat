<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 190" width="200" height="190" stroke-linecap="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ffa41b"/></linearGradient>
    <linearGradient id="cloud" gradientUnits="userSpaceOnUse" x1="0" y1="38" x2="0" y2="134"><stop offset="0" stop-color="#a5e0ff"/><stop offset="1" stop-color="#3b9bff"/></linearGradient>
    <linearGradient id="rain" gradientUnits="userSpaceOnUse" x1="0" y1="146" x2="0" y2="184"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#3b9bff"/></linearGradient>
  </defs>
  <style>
    .rays { transform-origin: 138px 62px; animation: spin 30s linear infinite; }
    .drop { animation: fall 1.3s ease-in infinite; }
    .d1 { animation-delay: .3s; } .d2 { animation-delay: .65s; } .d3 { animation-delay: .95s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fall { 0% { transform: translate(4px,-6px); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(-4px,8px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <!-- sun (behind the cloud) -->
  <g class="rays" stroke="#ffbf30" stroke-width="10" fill="none"><path d="M180.5 79.6L193.4 85.0"/><path d="M155.6 104.5L161.0 117.4"/><path d="M120.4 104.5L115.0 117.4"/><path d="M95.5 79.6L82.6 85.0"/><path d="M95.5 44.4L82.6 39.0"/><path d="M120.4 19.5L115.0 6.6"/><path d="M155.6 19.5L161.0 6.6"/><path d="M180.5 44.4L193.4 39.0"/></g>
  <circle cx="138" cy="62" r="38" fill="url(#sun)"/>
  <!-- cloud: one gradient shared by every shape so they merge smoothly -->
  <g fill="url(#cloud)">
    <rect x="14" y="94" width="138" height="40" rx="20"/>
    <circle cx="48" cy="96" r="28"/>
    <circle cx="88" cy="74" r="36"/>
    <circle cx="124" cy="98" r="28"/>
  </g>
  <!-- rain -->
  <g stroke="url(#rain)" stroke-width="10" fill="none"><path class="drop d0" d="M44 148l-8 22"/><path class="drop d1" d="M76 158l-8 22"/><path class="drop d2" d="M108 148l-8 22"/><path class="drop d3" d="M140 158l-8 22"/></g>
</svg>
